<!-- templates/upload_form_attendance.html -->
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>NNRG College Attendance</title>
    <style>
        body {
            background: url('{{ url_for('static', filename='nnrg.jpeg') }}') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-top: 50px;
            font-size: 24px;
        }

        form {
            width: 80%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        label {
            display: block;
            width: 50%;
            float: left;
            clear: both;
            margin: 10px 0;
            font-size: 16px;
        }

        input[type="file"],
        input[type="date"],
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="submit"] {
            background: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
<h1>NNRG College Attendance</h1>

<form method="POST" action="/" enctype="multipart/form-data">
    <div class="form-field">
        <label for="csv_file">Upload Attendance File</label>
        <input type="file" name="csv_file" id="csv_file" required>
    </div>
    <div class="form-field">
        <label for="date">Select Attendance Date</label>
        <input type="date" name="date" id="date" required>
    </div>
    <input type="submit" value="Process and Download">
</form>
</body>
</html>
